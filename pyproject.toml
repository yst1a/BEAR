[project]
name = "bear"
version = "0.1.0"
description = "Bit-exact accumulator re-encoding with formal verification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Anonymous Authors"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
export = ["torch>=2.1", "triton>=2.1; sys_platform == 'linux'"]

[project.scripts]
bear = "bear.cli:main"

[tool.setuptools.packages.find]
include = ["bear", "bear.*"]
